name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix backend --ignore-scripts --no-fund
      - run: npm audit --prefix backend --audit-level=moderate
      - run: node --test backend/tests/service.test.mjs tests/privacy.test.mjs
